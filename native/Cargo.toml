[package]
name = "raw2dng"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rawler = "=0.8.0"
jni = "0.21"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
jpeg-decoder = "=0.3.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
panic = "unwind"
